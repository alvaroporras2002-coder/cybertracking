<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none" role="img" aria-labelledby="ct-lab-title ct-lab-desc">
<title id="ct-lab-title">Tu arquitectura de aprendizaje</title>
<desc id="ct-lab-desc">Laboratorio isométrico flotante con tres plataformas, una terminal, tarjetas de lecciones, anillos de conocimiento y un escudo de seguridad.</desc>
<defs>
<linearGradient id="ct-platform" x1="130" y1="220" x2="430" y2="410" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFAFF"/><stop offset="1" stop-color="#DAD7FF"/></linearGradient>
<linearGradient id="ct-front" x1="135" y1="270" x2="350" y2="427" gradientUnits="userSpaceOnUse"><stop stop-color="#AAA3EE"/><stop offset="1" stop-color="#7365CD"/></linearGradient>
<linearGradient id="ct-screen" x1="244" y1="113" x2="398" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#37335D"/><stop offset="1" stop-color="#181C3C"/></linearGradient>
<linearGradient id="ct-shield" x1="408" y1="80" x2="482" y2="207" gradientUnits="userSpaceOnUse"><stop stop-color="#A699FF"/><stop offset="1" stop-color="#5D4ED1"/></linearGradient>
<linearGradient id="ct-mint" x1="103" y1="200" x2="170" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#B9F4E5"/><stop offset="1" stop-color="#64CAB7"/></linearGradient>
<radialGradient id="ct-ground"><stop stop-color="#7165CD" stop-opacity=".18"/><stop offset="1" stop-color="#7165CD" stop-opacity="0"/></radialGradient>
<filter id="ct-shadow" x="-35%" y="-35%" width="170%" height="190%"><feGaussianBlur stdDeviation="11"/></filter>
<filter id="ct-card-shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#312B70" flood-opacity=".12"/></filter>
</defs>
<style>
@keyframes ctIsoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ctIsoOrbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-72}}
@keyframes ctIsoPacket{0%,100%{opacity:.25}45%,65%{opacity:1}}
@keyframes ctIsoScan{0%,100%{opacity:.22}50%{opacity:.85}}
@keyframes ctIsoRing{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-5px);opacity:1}}
.iso-float{animation:ctIsoFloat 6s ease-in-out infinite}.iso-float.second{animation-delay:-2.3s;animation-duration:7s}.iso-float.third{animation-delay:-4s;animation-duration:6.7s}
.iso-orbit{animation:ctIsoOrbit 12s linear infinite;stroke-dasharray:4 8}.iso-packet{animation:ctIsoPacket 3s ease-in-out infinite}.iso-packet.second{animation-delay:1s}.iso-scan{animation:ctIsoScan 3.6s ease-in-out infinite}.iso-ring{animation:ctIsoRing 5s ease-in-out infinite}
html[data-motion="off"] .iso-float,html[data-motion="off"] .iso-orbit,html[data-motion="off"] .iso-packet,html[data-motion="off"] .iso-scan,html[data-motion="off"] .iso-ring{animation:none!important}
html[data-visibility="hidden"] .iso-float,html[data-visibility="hidden"] .iso-orbit,html[data-visibility="hidden"] .iso-packet,html[data-visibility="hidden"] .iso-scan,html[data-visibility="hidden"] .iso-ring{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.iso-float,.iso-orbit,.iso-packet,.iso-scan,.iso-ring{animation:none!important}}
</style>
